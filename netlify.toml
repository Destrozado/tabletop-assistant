# netlify.toml — preparado en el plan 01-01, despliegue NO ejecutado (D-17)
#
# `publish` confirmado por una build real de esta máquina (`npm run generate`
# produce `.output/public`, no `dist` — resolución de la asunción A1 de 01-RESEARCH).

[build]
  command = "npm run generate"
  publish = ".output/public"

# Aún no existen /sw.js ni /manifest.webmanifest en esta fase (llegan en la Fase 4
# con @vite-pwa/nuxt), pero declarar la regla ahora evita olvidarla cuando ese
# módulo se instale — cierra el "stale service worker trap" descrito en CLAUDE.md.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
